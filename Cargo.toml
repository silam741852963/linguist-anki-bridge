[workspace]
members = [
    "crates/linguist-core",
    "crates/linguist-anki",
    "crates/linguist-snapshots",
    "crates/linguist-application",
    "crates/linguist-jobs",
    "crates/linguist-desktop",
    "crates/linguist-ollama",
    "crates/linguist-ocr",
    "crates/linguist-dictionary",
    "crates/linguist-media",
    "crates/linguist-audio",
    "crates/linguist-pipeline",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
linguist-core = { path = "crates/linguist-core" }
linguist-application = { path = "crates/linguist-application" }
linguist-jobs = { path = "crates/linguist-jobs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
rusqlite = { version = "0.32.1", features = ["bundled"] }
libc = "0.2.189"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync"] }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
