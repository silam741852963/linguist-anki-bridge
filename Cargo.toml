[workspace]
members = ["crates/linguist-core", "crates/linguist-cli", "crates/linguist-config", "crates/linguist-store", "crates/linguist-anki", "crates/linguist-application", "crates/linguist-dictionary", "crates/linguist-provider"]
default-members = ["crates/linguist-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
linguist-core = { path = "crates/linguist-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "0.10"
schemars = { version = "=1.2.2", features = ["uuid1"] }
ammonia = "=4.2.0"
language-tags = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
clap = { version = "=4.6.7", features = ["derive"] }
toml = "0.9"

linguist-config = { path = "crates/linguist-config" }
url = "2.5"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks", "collation"] }
unicase = "=2.6.0"
linguist-store = { path = "crates/linguist-store" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
linguist-anki = { path = "crates/linguist-anki" }
linguist-application = { path = "crates/linguist-application" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
csv = "=1.4.0"
zip = { version = "=8.6.0", default-features = false }
zstd = "=0.14.0"
prost = "=0.14.4"
sha1 = "=0.11.0"

linguist-dictionary = { path = "crates/linguist-dictionary" }
linguist-provider = { path = "crates/linguist-provider" }
html-escape = "=0.2.15"
httpdate = "=1.0.3"
clap_complete = "=4.6.11"
scraper = "=0.27.0"
percent-encoding = "=2.3.2"
unicode-normalization = "=0.1.25"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "id3v2"] }
