<div class="lab-card lab-drill" data-tags="{{Tags}}">
<div class="lab-task">{{Instruction}}</div>
<div class="lab-drill-prompt">{{Prompt}}</div>
<hr id="answer">
<section class="lab-panel lab-drill-answer"><h4>Answers</h4>{{Answer}}</section>
{{#Changes}}<section class="lab-panel lab-drill-change"><h4>Changes</h4>{{Changes}}</section>{{/Changes}}
{{#Translation}}<section class="lab-panel lab-drill-translation"><h4>Meaning</h4>{{Translation}}</section>{{/Translation}}
{{#Source}}<section class="lab-panel lab-drill-source"><h4>Source</h4>{{Source}}</section>{{/Source}}
</div>
