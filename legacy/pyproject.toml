[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linguist-anki-bridge"
version = "0.0.1"
description = "Bridge local Anki and Ollama with Crawl4AI scrapers for language learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lam", email = "lam@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=8.2,<9",
    "pytesseract>=0.3.10",
    "crawl4ai>=0.9.2,<0.10",
    "lxml>=6,<7",
    "gTTS>=2.5.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
linguist-anki-bridge = "linguist_anki_bridge.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linguist_anki_bridge = [
    "templates/japanese_vocab/*.html",
    "templates/japanese_vocab/*.css",
]
