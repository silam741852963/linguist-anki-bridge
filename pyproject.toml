[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linguist-anki-bridge"
version = "0.1.0"
description = "An open-source Python tool that interfaces with an Anki desktop application to automate and enhance language learning workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Lam", email = "lam@example.com" }
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "google-genai>=0.1.0",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "responses>=0.25.0",
]

[project.scripts]
linguist-anki-bridge = "linguist_anki_bridge.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/linguist_anki_bridge"]
