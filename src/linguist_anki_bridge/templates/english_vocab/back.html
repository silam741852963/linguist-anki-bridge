<main class="lab-shell lab-back" lang="en">
  <header class="lab-answer">
    <div class="lab-kicker">English</div>
    <div class="lab-expression">{{Expression}}</div>
    {{#Audio}}<div class="lab-reading">{{Audio}}</div>{{/Audio}}
  </header>
  {{#Picture}}<section class="lab-picture" aria-label="Meaning image">{{Picture}}</section>{{/Picture}}
  {{#Meaning}}
  <section class="lab-panel lab-meaning">
    <div class="lab-panel-title">Meaning &amp; usage</div>
    <div class="lab-content">{{Meaning}}</div>
  </section>
  {{/Meaning}}
</main>
